[package]
name = "engine-ai-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
async-openai = { workspace = true }
async-trait = "0.1"
futures = "0.3"
paste = "1.0"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
