[package]
name = "engine-ai-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
async-openai = { workspace = true }
async-trait = "0.1"
futures = "0.3"
inventory = "0.3"
indoc = "2.0.7"
jsonschema = "0.45.0"
ollama-rs = { version = "0.2", default-features = false, features = ["rustls"] }
paste = "1.0"
rand = "0.8"
reqwest = { workspace = true }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
