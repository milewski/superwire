[package]
name = "superwire-lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "superwire-lsp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
superwire-core = { path = "../superwire-core" }
superwire-dsl = { path = "../superwire-dsl" }
superwire-semantic = { path = "../superwire-semantic" }
lsp-server = "0.7"
lsp-types = "0.97"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
colog = { workspace = true }

[dev-dependencies]
superwire-macros = { path = "../superwire-macros" }
superwire-test-support = { path = "../superwire-test-support" }

[[bench]]
name = "completion_filtering"
harness = false
