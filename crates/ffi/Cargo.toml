[package]
name = "ffi"
version = "0.1.0"
edition = "2021"

[features]
default = []
php-ext = ["dep:ext-php-rs"]

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
engine-ai-agent = { path = "../agent" }
engine-ai-core = { path = "../core" }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ext-php-rs = { version = "0.15", optional = true, default-features = false, features = ["runtime"] }
