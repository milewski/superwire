services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/crates/ffi/php
    volumes:
      - ../../..:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - ./target:/workspace/target
#    environment:
#      RUSTFLAGS: "-C target-feature=-crt-static"
    command: cargo build -p ffi --features php-ext --target x86_64-unknown-linux-gnu --release
#    command: ["sleep", "infinity"]
#    command: bash -c "rustup target add x86_64-unknown-linux-musl && apt-get update && apt install musl-tools && "

volumes:
  cargo-registry:
  cargo-git:
