services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/crates/ffi/php
    volumes:
      - ../../..:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - workspace-target:/workspace/target
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      ENGINE_AI_FFI_PHP_WORKSPACE_ROOT: /workspace
    command: ["sleep", "infinity"]

volumes:
  cargo-registry:
  cargo-git:
  workspace-target:
