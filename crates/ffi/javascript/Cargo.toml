[package]
name = "engine-ai-js"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
engine-ai-core = { path = "../../core" }
napi = { version = "3", features = ["async", "serde-json"] }
napi-derive = "3"
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
