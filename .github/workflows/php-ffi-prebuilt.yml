name: PHP FFI Prebuilt

on:
  workflow_dispatch:
  push:
    tags:
      - 'ffi-php-v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform_key }} PHP ${{ matrix.php_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.2.29', '8.3.24', '8.4.19']
        include:
          - docker_platform: linux/amd64
            target_triple: x86_64-unknown-linux-gnu
            platform_key: linux-x86_64-gnu
          - docker_platform: linux/amd64
            target_triple: x86_64-unknown-linux-musl
            platform_key: linux-x86_64-musl
          - docker_platform: linux/arm64
            target_triple: aarch64-unknown-linux-gnu
            platform_key: linux-aarch64-gnu
          - docker_platform: linux/arm64
            target_triple: aarch64-unknown-linux-musl
            platform_key: linux-aarch64-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build prebuilt binary in Docker
        env:
          PHP_VERSION: ${{ matrix.php_version }}
          PHP_ZTS: '0'
          TARGET_TRIPLE: ${{ matrix.target_triple }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
        run: bash crates/ffi/php/scripts/build-prebuilt-docker.sh

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-ai-ffi-php-${{ matrix.platform_key }}-php${{ matrix.php_version }}-nts
          path: |
            crates/ffi/php/dist/prebuilt/*.so
            crates/ffi/php/dist/prebuilt/*.sha256
          if-no-files-found: error
