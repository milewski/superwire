name: Laravel Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'integration/superwire-laravel/**'
      - 'integration/superwire-laravel'
      - '.gitmodules'
      - '.github/workflows/laravel.yml'
  push:
    branches: [main]
    paths:
      - 'integration/superwire-laravel/**'
      - 'integration/superwire-laravel'
      - '.gitmodules'
      - '.github/workflows/laravel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP 8.4 / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration/superwire-laravel
    strategy:
      fail-fast: false
      matrix:
        dependencies:
          - locked
          - latest
          - prefer-lowest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate Composer package
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ runner.os }}-php-8.4-composer-${{ matrix.dependencies }}-${{ hashFiles('integration/superwire-laravel/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-${{ matrix.dependencies }}-
            ${{ runner.os }}-php-8.4-composer-

      - name: Install Composer dependencies
        shell: bash
        run: |
          case "${{ matrix.dependencies }}" in
            locked)
              composer install --no-interaction --no-progress --prefer-dist
              ;;
            latest)
              composer update --no-interaction --no-progress --prefer-dist
              ;;
            prefer-lowest)
              composer update --prefer-lowest --no-interaction --no-progress --prefer-dist
              ;;
          esac

      - name: Run Laravel tests
        run: composer test