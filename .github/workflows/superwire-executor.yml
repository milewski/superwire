name: Executor Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'vendor/**'
      - 'playground/**'
      - 'documentation/docs/public/**'
      - 'editors/textmate/syntaxes/wire.tmLanguage.json'
      - '.github/workflows/superwire-executor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'vendor/**'
      - 'playground/**'
      - 'documentation/docs/public/**'
      - 'editors/textmate/syntaxes/wire.tmLanguage.json'
      - '.github/workflows/superwire-executor.yml'
  workflow_dispatch:

concurrency:
  group: executor-docker-${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'publish-main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE_NAME: superwire

jobs:
  build-and-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch_tag: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch_tag: arm64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Select pull request image repository
        if: github.event_name == 'pull_request'
        id: pull-request-image
        shell: bash
        run: echo "repository=local/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Select publish image repository
        if: github.event_name != 'pull_request'
        id: publish-image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "DOCKERHUB_USERNAME is required for publish events" >&2
            exit 1
          fi

          echo "repository=${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.pull-request-image.outputs.repository || steps.publish-image.outputs.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.pull-request-image.outputs.repository || steps.publish-image.outputs.repository }}:${{ github.sha }}-${{ matrix.arch_tag }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-manifest:
    needs: build-and-publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64"
