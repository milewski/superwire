[package]
name = "cersei-provider"
version = "0.1.9"
edition = "2021"
authors = ["Adib Mohsin"]
license = "MIT"
repository = "https://github.com/pacifio/cersei"
description = "Provider trait and built-in LLM providers for the Cersei SDK"

[dependencies]
cersei-types = { git = "https://github.com/pacifio/cersei", rev = "ab37ead06aaa72419e9bae757ac886fc68091877", package = "cersei-types" }
async-trait = "0.1"
tokio = { version = "1.44", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "rustls-tls-webpki-roots"], default-features = false }
reqwest-eventsource = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
chrono = "0.4"
base64 = "0.22"
url = "2"
