[workspace]
members = ["crates/core", "crates/lsp", "crates/cli", "crates/executor"]
exclude = ["vendor/cersei-provider"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unused_self = "allow"
similar_names = "allow"
match_same_arms = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
match_wildcard_for_single_variants = "allow"

[workspace.dependencies]
clap = { version = "4.6.0", features = ["derive"] }
pest = "2.8"
pest_derive = "2.8"
petgraph = "0.8"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["full"] }
thiserror = "2.0"
log = "0.4"
colog = "1.4"
jsonschema = "0.45"
regex = "1.12"
once_cell = "1.20"
humantime = "2.3"
sha2 = "0.10"
cersei-provider = { git = "https://github.com/pacifio/cersei", rev = "ab37ead06aaa72419e9bae757ac886fc68091877", package = "cersei-provider" }
cersei-types = { git = "https://github.com/pacifio/cersei", rev = "ab37ead06aaa72419e9bae757ac886fc68091877", package = "cersei-types" }

[patch."https://github.com/pacifio/cersei"]
cersei-provider = { path = "vendor/cersei-provider" }
