[workspace]
members = [
    "crates/superwire-types",
    "crates/superwire-dsl",
    "crates/superwire-test-support",
    "crates/superwire-macros",
    "crates/superwire-semantic",
    "crates/superwire-mcp",
    "crates/superwire-protocol",
    "crates/superwire-model",
    "crates/superwire-provider-cersei",
    "crates/superwire-executor-server",
    "crates/superwire-core",
    "crates/superwire-lsp",
    "crates/superwire-cli",
    "crates/superwire-executor",
]
exclude = ["vendor/cersei-provider"]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unused_self = "allow"
similar_names = "allow"
match_same_arms = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
match_wildcard_for_single_variants = "allow"

[workspace.dependencies]
clap = { version = "4.6.0", features = ["derive"] }
pest = "2.8"
pest_derive = "2.8"
petgraph = "0.8"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["full"] }
thiserror = "2.0"
log = "0.4"
colog = "1.4"
jsonschema = "0.46.5"
regex = "1.12"
once_cell = "1.20"
humantime = "2.3"
sha2 = "0.11.0"
cersei-provider = "0.1.9"
cersei-types = "0.1.9"

[patch.crates-io]
cersei-provider = { path = "vendor/cersei-provider" }
