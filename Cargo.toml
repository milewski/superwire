[workspace]
members = ["crates/core", "crates/macros", "crates/example"]
resolver = "2"

[workspace.dependencies]
pest = "2.7"
pest_derive = "2.7"
petgraph = "0.6"
rayon = "1.10"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
thiserror = "2.0"
log = "0.4"
colog = "1.3"
ollama-rs = "0.2"
jsonschema = "0.26"
regex = "1.11"
