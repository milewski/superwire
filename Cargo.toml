[workspace]
members = [
    "crates/core",
    "crates/macros",
    "crates/example",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
engine-ai-core = { path = "crates/core" }
engine-ai-macros = { path = "crates/macros" }
pest = "2.7"
pest_derive = "2.7"
petgraph = "0.6"
rayon = "1.10"
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
colog = "1.3"
ollama-rs = { version = "0.3", features = ["tool-implementations"] }
schemars = "1.2"
jsonschema = "0.18"
async-trait = "0.1"
regex = "1.11"
once_cell = "1.21"
indexmap = { version = "2.8", features = ["serde"] }
serde_with = "3.12"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
